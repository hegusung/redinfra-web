# nginx reverse proxy — RedInfra Dashboard (app.py on :4444)
# Copy to /etc/nginx/sites-available/redinfra and enable with:
#   ln -s /etc/nginx/sites-available/redinfra /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name redinfra.local;  # ← adjust (domain or IP)

    # Redirect HTTP → HTTPS (uncomment if TLS is enabled below)
    # return 301 https://$host$request_uri;

    # ── Logs ──────────────────────────────────────────────────────────────────
    access_log /var/log/nginx/redinfra_access.log;
    error_log  /var/log/nginx/redinfra_error.log;

    # ── Basic security ────────────────────────────────────────────────────────
    add_header X-Frame-Options        "SAMEORIGIN"   always;
    add_header X-Content-Type-Options "nosniff"      always;
    add_header X-XSS-Protection       "1; mode=block" always;

    # ── Restricted access (optional: IP whitelist) ────────────────────────────
    # allow 192.168.1.0/24;
    # deny all;

    # ── Uploads ───────────────────────────────────────────────────────────────
    # 1m above the app's MAX_CONTENT_LENGTH (51m = 50 MB upload + multipart overhead)
    # so an oversized upload is rejected by Flask as JSON, not by nginx as HTML.
    client_max_body_size 52m;
    client_body_timeout  300s;   # slow links uploading large files

    # ── Proxy to Flask ────────────────────────────────────────────────────────
    location / {
        proxy_pass         http://127.0.0.1:4444;
        proxy_http_version 1.1;

        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming (terminal output)
        proxy_set_header   Connection        "";
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;   # long timeout for Ansible/Terraform runs

        # Stream uploads straight to Flask instead of spooling the whole body to disk
        proxy_request_buffering off;
    }
}

